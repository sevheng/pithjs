<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Pith: a tiny framework built on native web tech.">
  <title>Pith</title>
  <script>
    try { var t = localStorage.getItem('pith-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9.5' fill='none' stroke='%231f5fd6' stroke-width='2.5'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%231f5fd6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/main.css">
  <script type="importmap">
    { "imports": { "pith": "/pith/index.js" } }
  </script>
  <!-- Preload the app shell so the browser fetches it in parallel. Pages load on demand (see app/router.js). -->
  <link rel="modulepreload" href="/pith/index.js">
  <link rel="modulepreload" href="/pith/signal.js">
  <link rel="modulepreload" href="/pith/dev.js">
  <link rel="modulepreload" href="/pith/html.js">
  <link rel="modulepreload" href="/pith/component.js">
  <link rel="modulepreload" href="/pith/router.js">
  <link rel="modulepreload" href="/pith/transition.js">
  <link rel="modulepreload" href="/pith/store.js">
  <link rel="modulepreload" href="/pith/resource.js">
  <link rel="modulepreload" href="/pith/form.js">
  <link rel="modulepreload" href="/app/main.js">
  <link rel="modulepreload" href="/app/static-api.js">
  <link rel="modulepreload" href="/app/router.js">
  <link rel="modulepreload" href="/app/store.js">
  <link rel="modulepreload" href="/app/components/nav-bar.js">
  <link rel="modulepreload" href="/app/brand.js">
  <link rel="modulepreload" href="/app/docs/index.js">
  <link rel="modulepreload" href="/app/apps.js">
  <script type="module" src="/app/main.js"></script>
</head>
<body>
  <div id="app">
    <noscript><p style="padding:1rem">This demo needs JavaScript turned on.</p></noscript>
  </div>
</body>
</html>
