<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Mini: a tiny framework built on native web tech.">
  <title>Mini</title>
  <script>
    try { var t = localStorage.getItem('mini-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles/main.css">
  <script type="importmap">
    { "imports": { "mini": "/mini/index.js", "mini/ui": "/mini/ui.js" } }
  </script>
  <!-- Preload the app shell so the browser fetches it in parallel. Pages load on demand (see app/router.js). -->
  <link rel="modulepreload" href="/mini/index.js">
  <link rel="modulepreload" href="/mini/signal.js">
  <link rel="modulepreload" href="/mini/dev.js">
  <link rel="modulepreload" href="/mini/html.js">
  <link rel="modulepreload" href="/mini/component.js">
  <link rel="modulepreload" href="/mini/router.js">
  <link rel="modulepreload" href="/mini/store.js">
  <link rel="modulepreload" href="/app/main.js">
  <link rel="modulepreload" href="/app/router.js">
  <link rel="modulepreload" href="/app/components/nav-bar.js">
  <script type="module" src="/app/main.js"></script>
</head>
<body>
  <div id="app">
    <noscript><p style="padding:1rem">This demo needs JavaScript turned on.</p></noscript>
  </div>
</body>
</html>
