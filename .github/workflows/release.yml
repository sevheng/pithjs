# A GitHub Release for each version tag (git tag v0.1.0 && git push --tags):
#   - checks the tag matches framework/package.json's version, and that everything passes (npm run check)
#   - packs the pithjs package (framework/) into pithjs-<version>.tgz
#   - creates the release with that version's notes from framework/CHANGELOG.md, and attaches the .tgz (what
#     `npx --package=<its URL> pith create` and new projects install) and pith.min.js (Pith in one file)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./framework/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but framework/package.json says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Everything passes
        working-directory: demo
        run: |
          npm ci
          npm run check

      - name: Pack
        working-directory: framework
        run: npm pack

      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v { on = 1; next } /^## / { on = 0 } on' framework/CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## $VERSION' section in framework/CHANGELOG.md"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "framework/pithjs-$VERSION.tgz" \
            "framework/pith/pith.min.js" \
            --title "Pith $VERSION" --notes-file notes.md
